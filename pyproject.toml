[project]
name = "subagent-multiturn-prompting"
version = "0.1.0"
description = "Pull-model progressive disclosure layer for multi-turn subagent prompting."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.29.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]
